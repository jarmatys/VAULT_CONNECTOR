# The static checks on every pull request and on master: the secret scan of the history, typecheck, lint and the unit
# suite, in one job (each job is billed rounded up to a whole minute, and the scan alone takes seconds). No secrets:
# workflows from forks run with a read-only token, and the job runs on GitHub's runner (public repository). The e2e
# suites, the release dry run and the self-hosted stack are e2e.yml and self-host.yml, on pull requests only.
name: checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: secrets, typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # First, so a leak fails fast. Only the history of the checked-out commit: `fetch-depth: 0` also fetches every
      # other branch, and their findings belong to their own pull requests.
      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --log-opts=HEAD --redact --verbose
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          CI: "true"
      - run: npm run typecheck
      # ESLint (type-checked rules, zero warnings) and the language gate over every tracked file.
      - run: npm run lint
      - run: npm test
