# The weekly check of VaultConnector's off-site backup, first written by `softure-deploy init --host=cloudflare`
# (@softure-ai/deploy 0.7.1); the app owns this file. It downloads the newest encrypted dump with the read-only token,
# restores it into a throwaway Postgres on the runner, runs the schema guard against the migrations of the default
# branch and counts the rows of deploy.json's database.rowCountTables, then drops it. A copy older than 26 hours, one
# that does not decrypt or restore, or a failed guard fails the run, and GitHub mails the failure.
#
# Settings live in the GitHub Environment `backup-verify`, which only this workflow uses (never the deploy's):
#   variables: BACKUP_S3_ENDPOINT, BACKUP_S3_REGION, BACKUP_S3_BUCKET, BACKUP_S3_PREFIX
#   secrets:   BACKUP_S3_READ_ACCESS_KEY_ID, BACKUP_S3_READ_SECRET_ACCESS_KEY (the read-only token)
#              BACKUP_AGE_IDENTITY (the age private key, AGE-SECRET-KEY-1…)
# Like backup.yml, the schedule waits for the repository variable PRODUCTION_LIVE=true; "Run workflow" always runs.

name: backup verify

on:
  schedule:
    # Monday 05:40 UTC, after the night's backup.yml (03:17 UTC) has uploaded.
    - cron: "40 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRODUCTION_LIVE == 'true' }}
    # GitHub's runner only: this job holds the age private key.
    runs-on: ubuntu-latest
    environment: backup-verify
    timeout-minutes: 60
    services:
      postgres:
        # The restore target needs what production has: pgvector (the search index) on Neon's major version, 17.
        # pg_restore must be at least as new as the pg_dump that wrote the copy (backup.yml's postgres-major).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          CI: "true"
      # The migrations the app ships, for the schema guard (a VPS copies them out of its image instead).
      - run: npx softure migrate --export-migrations ./softure-migrations
      - name: PostgreSQL tools
        run: |
          cat > "$RUNNER_TEMP/pg_restore" <<'WRAPPER'
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE postgres:17 pg_restore "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/pg_restore"
          echo "BACKUP_PG_RESTORE=$RUNNER_TEMP/pg_restore" >> "$GITHUB_ENV"
      - name: Verify the newest off-site copy
        env:
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          BACKUP_S3_READ_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_READ_ACCESS_KEY_ID }}
          BACKUP_S3_READ_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_READ_SECRET_ACCESS_KEY }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_VERIFY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # The key goes in on stdin, never as an argument.
        run: |
          printf '%s\n' "$BACKUP_AGE_IDENTITY" \
            | npx --yes --package=@softure-ai/backup@0.1.1 softure-backup verify --app=vaultconnector --identity=- --config=deploy.json --migrations-dir=softure-migrations
