# The e2e suites on pull requests that change more than documentation, and before every release (release.yml calls this
# workflow on the tag it deploys). Pull requests are merged after these jobs passed on their head, so a push to master
# does not run them again; checks.yml still runs the static checks there. No secrets: workflows from forks run with a
# read-only token, and every job runs on GitHub's runners (public repository).
#
# The suite runs on both hosts the app supports: on Node (`next start`, the self-hosted `vps+node`) and on Cloudflare's
# runtime (OpenNext build served by `wrangler dev` in workerd, no Cloudflare account), each against Postgres with
# pgvector, reached through the Hyperdrive binding's local connection string on workerd. The Workers job then runs the
# release path on the same build without Cloudflare: SOFTURE/AI's deploy-cloudflare action the way release.yml runs it,
# on a fake account, so a change that would break the deploy fails here and not on the owner's release:
# - the tag check runs on a local tag `dry-run` and a local branch ref of the same name;
# - the migration runs for real, on an empty second database of the same Postgres service (pgvector, as on Neon);
# - scripts/deploy/wrangler.ts renders the production configuration of wrangler.jsonc with placeholder values and,
#   with WRANGLER_DRY_RUN=1, checks the secrets file against `secrets.required` and bundles the Worker with
#   `wrangler deploy --dry-run`; the rollback step would only print;
# - verify runs deploy.json against the same build served by `wrangler dev` over https on localhost, with a throwaway
#   certificate the job trusts. HSTS comes from Cloudflare's edge, not from the app, so that one header check is
#   left out here and stays in production's verify.
name: e2e

on:
  pull_request:
    # Documentation only: context/, docs/ and the Markdown files at the root. content/ is the app's own pages, so it
    # is not ignored.
    paths-ignore:
      - "context/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to test (release.yml passes the tag it deploys)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: e2e on Node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultconnector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaultconnector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaultconnector
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          CI: "true"
      - uses: ./.github/actions/playwright
      - run: npm run migrate
      - run: npm run build
      - run: npm run e2e
      - name: Keep traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  e2e-workers:
    name: e2e and release dry run on Workers (workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultconnector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaultconnector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaultconnector
      # The release dry run migrates its own, empty database.
      DRY_RUN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaultconnector_dry_run
      # scripts/deploy/wrangler.ts: no upload, whatever the token says.
      WRANGLER_DRY_RUN: "1"
      DRY_RUN_PORT: "8787"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          CI: "true"
      - uses: ./.github/actions/playwright
      - run: npm run migrate
      - run: npm run build:cloudflare
      - run: npm run e2e:workers
      - name: Keep traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-workers-test-results
          path: test-results/
          retention-days: 7
      - name: Create the dry run's empty database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres vaultconnector_dry_run
      - name: Tag the commit as the release being deployed
        run: |
          git tag dry-run HEAD
          git update-ref refs/remotes/origin/dry-run HEAD
      - run: npm run build:cloudflare
      - name: Serve the build over https on localhost
        run: |
          tls="$RUNNER_TEMP/dry-run-tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$tls/key.pem" -out "$tls/cert.pem" 2> /dev/null
          # verify (Node) trusts the throwaway certificate; nothing else does.
          echo "NODE_EXTRA_CA_CERTS=$tls/cert.pem" >> "$GITHUB_ENV"
          # The migration is the action's step; the server starts on an empty database and answers once it ran.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$DRY_RUN_DATABASE_URL" nohup npx wrangler dev \
            --port "$DRY_RUN_PORT" --ip 127.0.0.1 --inspector-port 9230 --persist-to .wrangler/dry-run \
            --local-protocol https --https-key-path "$tls/key.pem" --https-cert-path "$tls/cert.pem" \
            --var "APP_ORIGIN:https://localhost:$DRY_RUN_PORT" > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sS -o /dev/null --cacert "$tls/cert.pem" "https://localhost:$DRY_RUN_PORT/"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/wrangler-dev.log"
          exit 1
      - name: Verify config without the edge's HSTS
        run: jq 'del(.verify.headers["strict-transport-security"])' deploy.json > "$RUNNER_TEMP/deploy.dry-run.json"
      - uses: SOFTURE/AI/.github/actions/deploy-cloudflare@a8f8af4c1372c63ce86b2ecfc7c08e1ac84381f2
        env:
          # Placeholders in the shape of the real values: a reserved domain and an id of zeros.
          APP_DOMAIN: vaultconnector.invalid
          HYPERDRIVE_ID: "00000000000000000000000000000000"
          # Stand-ins for the Worker's secrets, so the dry run checks the secrets file against secrets.required.
          RESEND_API_KEY: dry-run
          MAIL_FROM: VaultConnector <hello@vaultconnector.invalid>
          MAILING_UNSUBSCRIBE_SECRET: dry-run
          SOFTURE_EMAIL_KEY_SECRET: dry-run
          GH_AUTH_CLIENT_ID: dry-run
          GH_AUTH_CLIENT_SECRET: dry-run
          GH_APP_ID: dry-run
          GH_APP_SLUG: dry-run
          GH_APP_PRIVATE_KEY: dry-run
          OPERATOR_NAME: Dry Run Operator
          OPERATOR_CONTACT: privacy@vaultconnector.invalid
          VAULT_S3_ENDPOINT: https://r2.vaultconnector.invalid
          VAULT_S3_BUCKET: dry-run
          VAULT_S3_ACCESS_KEY_ID: dry-run
          VAULT_S3_SECRET_ACCESS_KEY: dry-run
          VAULT_STORAGE_KEY_SECRET: dry-run-0000000000000000000000000000
          GH_WEBHOOK_SECRET: dry-run
          VAULT_SOURCE_KEYS: dry-run:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DROPBOX_APP_KEY: dryrunapp
          DROPBOX_APP_SECRET: dry-run-fictional-dropbox-secret
          STRIPE_SECRET_KEY: dry-run-fictional-stripe-key
          STRIPE_WEBHOOK_SECRET: dry-run-fictional-stripe-webhook-secret
          ALERTS_MAIL_TO: ops@vaultconnector.invalid
          ADMIN_EMAILS: ops@vaultconnector.invalid
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.vaultconnector.invalid/otlp
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=dry-run
        with:
          tag: dry-run
          release-branch: dry-run
          app-url: https://localhost:${{ env.DRY_RUN_PORT }}
          # A fake account: the token is not a token, and the account id is zeros.
          api-token: dry-run
          account-id: "00000000000000000000000000000000"
          build-command: ""
          migrate-database-url: ${{ env.DRY_RUN_DATABASE_URL }}
          migrate-command: npm run migrate
          wrangler: node scripts/deploy/wrangler.ts
          wrangler-env: production
          secret-names: RESEND_API_KEY MAIL_FROM MAILING_UNSUBSCRIBE_SECRET SOFTURE_EMAIL_KEY_SECRET GH_AUTH_CLIENT_ID GH_AUTH_CLIENT_SECRET GH_APP_ID GH_APP_SLUG GH_APP_PRIVATE_KEY OPERATOR_NAME OPERATOR_CONTACT VAULT_S3_ENDPOINT VAULT_S3_BUCKET VAULT_S3_ACCESS_KEY_ID VAULT_S3_SECRET_ACCESS_KEY VAULT_STORAGE_KEY_SECRET GH_WEBHOOK_SECRET VAULT_SOURCE_KEYS DROPBOX_APP_KEY DROPBOX_APP_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET ALERTS_MAIL_TO ADMIN_EMAILS OTEL_EXPORTER_OTLP_ENDPOINT OTEL_EXPORTER_OTLP_HEADERS
          deploy-config: ${{ runner.temp }}/deploy.dry-run.json
          deploy-cli-version: 0.7.9
          environment: dry-run
          report: "false"
      - name: The server's log of a failed run
        if: failure()
        run: cat "$RUNNER_TEMP/wrangler-dev.log" || true
